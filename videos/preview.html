<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Jingles de séquence — Sandbox</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08090b;
        --ink: #f7f0df;
        --muted: #aaa393;
        --line: #34343a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 48px clamp(20px, 5vw, 88px) 80px;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.5 Arial,
          sans-serif;
      }
      header {
        max-width: 1440px;
        margin: 0 auto 38px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 24px;
      }
      .eyebrow {
        color: var(--muted);
        font:
          700 12px/1.4 'Courier New',
          monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 10px 0 0;
        font:
          700 clamp(32px, 4vw, 56px)/1.05 Georgia,
          serif;
      }
      main {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px;
        max-width: 1440px;
        margin: auto;
      }
      article {
        border: 1px solid var(--line);
        border-radius: 4px;
        overflow: hidden;
        background: #111318;
      }
      article:nth-child(1) {
        --accent: #f2cb3f;
      }
      article:nth-child(2) {
        --accent: #42bec6;
      }
      article:nth-child(3) {
        --accent: #ed493f;
      }
      article:nth-child(4) {
        --accent: #7164c8;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 15px 18px;
      }
      .marker {
        width: 10px;
        height: 10px;
        background: var(--accent);
        transform: rotate(12deg);
      }
      h2 {
        margin: 0;
        font:
          700 20px/1.2 Georgia,
          serif;
      }
      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
      }
      .source {
        padding: 13px 18px 18px;
        color: var(--muted);
        font:
          12px/1.4 'Courier New',
          monospace;
        letter-spacing: 0.04em;
      }
      @media (max-width: 820px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="eyebrow">Sandbox · Motion design</div>
      <h1>Jingles de séquence</h1>
    </header>
    <main>
      <article>
        <div class="card-head">
          <span class="marker"></span>
          <h2>Le radar</h2>
        </div>
        <video
          controls
          preload="metadata"
          poster="le-radar-jingle/renders/proof/frame-14-00s.jpg"
          src="le-radar-jingle/renders/le%20radar.mp4"
          aria-label="Jingle Le radar"
        ></video>
        <div class="source">18,4 s · 1920 × 1080 · 30 i/s</div>
      </article>
      <article>
        <div class="card-head">
          <span class="marker"></span>
          <h2>Le build</h2>
        </div>
        <video
          controls
          preload="metadata"
          poster="le-build-jingle/renders/proof/frame-13-10s.jpg"
          src="le-build-jingle/renders/le%20build.mp4"
          aria-label="Jingle Le build"
        ></video>
        <div class="source">18,4 s · 1920 × 1080 · 30 i/s</div>
      </article>
      <article>
        <div class="card-head">
          <span class="marker"></span>
          <h2>Le clash</h2>
        </div>
        <video
          controls
          preload="metadata"
          poster="le-clash-jingle/renders/proof/frame-10-50s.jpg"
          src="le-clash-jingle/renders/le%20clash.mp4"
          aria-label="Jingle Le clash"
        ></video>
        <div class="source">15,6 s · 1920 × 1080 · 30 i/s</div>
      </article>
      <article>
        <div class="card-head">
          <span class="marker"></span>
          <h2>La bêta</h2>
        </div>
        <video
          controls
          preload="metadata"
          poster="la-beta-jingle/renders/proof/frame-13-00s.jpg"
          src="la-beta-jingle/renders/beta.mp4"
          aria-label="Jingle La bêta"
        ></video>
        <div class="source">18,0 s · 1920 × 1080 · 30 i/s</div>
      </article>
    </main>
  </body>
</html>
