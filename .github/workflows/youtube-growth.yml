name: YouTube SANDBOX — optimisation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    concurrency:
      group: youtube-quality-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: youtube_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: youtube_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Vérifier la syntaxe Python
        run: python -m compileall -q tools/youtube-growth/src tools/youtube-growth/tests
      - name: Installer les dépendances de test et de recette média
        run: python -m pip install "psycopg[binary]>=3.2,<4" "Pillow>=10,<13" "numpy>=2.2,<3"
      - name: Installer FFmpeg pour la recette des formats courts et thématiques
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Exécuter les tests Python
        env:
          YOUTUBE_TEST_DATABASE_URL: postgresql://youtube_test:local-test-only@localhost:5432/youtube_test
        run: python -m unittest discover -s tools/youtube-growth/tests -v

  poll:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: youtube-growth-main
      cancel-in-progress: false
    steps:
      - name: Vérifier la configuration avant toute installation
        id: configuration
        env:
          YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
          YOUTUBE_EXECUTE_ACTIONS: ${{ vars.YOUTUBE_EXECUTE_ACTIONS }}
          YOUTUBE_INITIAL_REVIEW_CONFIRMED: ${{ vars.YOUTUBE_INITIAL_REVIEW_CONFIRMED }}
          YOUTUBE_JOURNAL_DATABASE_URL: ${{ secrets.YOUTUBE_JOURNAL_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          enabled() {
            local value="${1,,}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            case "$value" in 1|true|yes|on) return 0 ;; *) return 1 ;; esac
          }
          if enabled "$YOUTUBE_EXECUTE_ACTIONS"; then
            if ! enabled "$YOUTUBE_INITIAL_REVIEW_CONFIRMED" || [ -z "$YOUTUBE_JOURNAL_DATABASE_URL" ] || [ -z "$YOUTUBE_OAUTH_TOKEN_JSON" ]; then
              echo '::error::Les écritures YouTube exigent OAuth, le journal Postgres et la validation initiale.'
              exit 1
            fi
          fi
          if [ -z "$YOUTUBE_OAUTH_TOKEN_JSON" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'OAuth YouTube absent : passage sans effet, aucune dépendance installée.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.configuration.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        if: steps.configuration.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/youtube-growth/requirements.txt

      - uses: actions/cache@v4
        if: steps.configuration.outputs.ready == 'true'
        with:
          path: tools/youtube-growth/.state
          key: youtube-growth-state-${{ github.run_id }}
          restore-keys: |
            youtube-growth-state-

      - name: Installer les dépendances
        if: steps.configuration.outputs.ready == 'true'
        run: python -m pip install --disable-pip-version-check -r tools/youtube-growth/requirements.txt

      - name: Traiter la chaîne
        if: steps.configuration.outputs.ready == 'true'
        env:
          PYTHONPATH: tools/youtube-growth/src
          YOUTUBE_STATE_PATH: tools/youtube-growth/.state/state.json
          YOUTUBE_OUTPUT_DIR: tools/youtube-growth/output
          YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
          YOUTUBE_EXECUTE_ACTIONS: ${{ vars.YOUTUBE_EXECUTE_ACTIONS }}
          YOUTUBE_INITIAL_REVIEW_CONFIRMED: ${{ vars.YOUTUBE_INITIAL_REVIEW_CONFIRMED }}
          YOUTUBE_JOURNAL_DATABASE_URL: ${{ secrets.YOUTUBE_JOURNAL_DATABASE_URL }}
          YOUTUBE_POST_EPISODE_COMMENT: ${{ vars.YOUTUBE_POST_EPISODE_COMMENT }}
          YOUTUBE_AUTO_REPLY: ${{ vars.YOUTUBE_AUTO_REPLY }}
          YOUTUBE_EPISODE_COMMENT_TEMPLATE: ${{ vars.YOUTUBE_EPISODE_COMMENT_TEMPLATE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python -m youtube_growth

      - name: Publier les propositions de miniatures en artefact
        if: always() && steps.configuration.outputs.ready == 'true' && hashFiles('tools/youtube-growth/output/**/*.png') != ''
        uses: actions/upload-artifact@v7
        with:
          name: miniatures-youtube-${{ github.run_number }}
          path: tools/youtube-growth/output/
          if-no-files-found: ignore
          retention-days: 30
